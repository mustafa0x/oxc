[package]
name = "rsvelte_esrap"
version = "0.10.36"
edition = "2024"
rust-version = "1.95"
description = "A Rust port of esrap — prints an oxc AST to JavaScript with esrap's exact layout"
license = "MIT"
repository = "https://github.com/baseballyama/rsvelte"
homepage = "https://baseballyama.github.io/rsvelte/"
documentation = "https://docs.rs/rsvelte_esrap"
readme = "README.md"
keywords = ["svelte", "compiler", "esrap", "printer"]
categories = ["compilers", "development-tools"]
publish = ["crates-io"]
autobins = false
autobenches = false
exclude = ["tests/**", "benches/**", "examples/**"]

[lib]
crate-type = ["rlib"]

[dependencies]
compact_str = "0.10"
memchr = "2.7"
oxc_allocator = { path = "../../../../crates/oxc_allocator" }
oxc_ast = { path = "../../../../crates/oxc_ast" }
oxc_span = { path = "../../../../crates/oxc_span" }
oxc_syntax = { path = "../../../../crates/oxc_syntax" }

[dev-dependencies]
oxc_parser = { path = "../../../../crates/oxc_parser" }
oxc_ast_visit = { path = "../../../../crates/oxc_ast_visit" }


[package.metadata.docs.rs]
all-features = true
